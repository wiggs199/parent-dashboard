<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4eee2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1813" media="(prefers-color-scheme: dark)" />
    <title>AntAriPath</title>
    <meta name="description" content="A calm place to log the day-to-day, keep the paperwork, and pull it together whenever you need to share it." />

    <!-- Social link previews (LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://antaripath.com" />
    <meta property="og:title" content="AntAriPath" />
    <meta property="og:description" content="A calm place to log the day-to-day, keep the paperwork, and pull it together whenever you need to share it." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AntAriPath" />
    <meta name="twitter:description" content="A calm place to log the day-to-day, keep the paperwork, and pull it together whenever you need to share it." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <script>
      // Apply the saved theme before paint to avoid a flash.
      try {
        var t = localStorage.getItem("np_theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
